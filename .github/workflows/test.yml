name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-hooks:
    name: native Windows hook commands
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/test_codex_windows_hooks.mjs

  verify:
    name: run-all (policy-block + frontmatter + hook/gate suites)
    runs-on: ubuntu-latest
    env:
      # Node/npm/bun suites must run for real in CI, not silently SKIP —
      # see tests/run-all.sh for the skip-to-fail conversion this enables.
      TH_REQUIRE_RUNTIMES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conditional-noop gate — NOT a `paths-ignore`
      # trigger filter. A `paths-ignore` on the job/workflow trigger would
      # leave this required check permanently "pending" for a diff that
      # matches it, blocking merge. Instead the job always runs (satisfying
      # the required-check contract) and each heavy step below is skipped
      # via `if:` when the diff is release-only (version sites + CHANGELOG +
      # changelog.d/ only — e.g. a per-PR version bump with no other changes).
      # Any diff outside that narrow allowlist, or any failure to compute the
      # diff, defaults to running the full suite (fail-closed toward more
      # verification, never less).
      - name: Detect release-only diff
        id: release-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          is_release_only=false
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
            if [ -n "$changed" ]; then
              is_release_only=true
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  .claude-plugin/plugin.json|.claude-plugin/marketplace.json|plugins/team-harness/.codex-plugin/plugin.json|cmd/install/main.go|CHANGELOG.md|changelog.d/*.md)
                    ;;
                  *)
                    is_release_only=false
                    ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "is_release_only=$is_release_only" >> "$GITHUB_OUTPUT"
          echo "Release-only diff: $is_release_only"

      - name: Verify shared version sites on distributed changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base SHA; skipping base/HEAD version comparison."
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          distributed=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              agents/*|skills/*|hooks/*|plugins/team-harness/*|.agents/*|.codex/*|runtime/schema/*|runtime/codex/*|tools/codex-runtime/*|assets.go)
                distributed=true ;;
              cmd/install/*_test.go)
                ;;
              cmd/install/*)
                distributed=true ;;
            esac
          done <<< "$changed"
          if [ "$distributed" != true ]; then
            echo "No distributed runtime input changed; shared version comparison is not required."
            exit 0
          fi

          plugin="$(jq -er '.version' .claude-plugin/plugin.json)"
          market="$(jq -er '.plugins[0].version' .claude-plugin/marketplace.json)"
          versions=("$plugin" "$market")
          sites=(.claude-plugin/plugin.json .claude-plugin/marketplace.json)

          # Codex and installer sites are required once present at BASE or
          # HEAD. This keeps the guard/CI compatible with the historical
          # two-site repository while enforcing all four sites today.
          has_codex=false
          if git cat-file -e "$BASE_SHA:plugins/team-harness/.codex-plugin/plugin.json" 2>/dev/null || [ -f plugins/team-harness/.codex-plugin/plugin.json ]; then
            has_codex=true
            codex="$(jq -er '.version' plugins/team-harness/.codex-plugin/plugin.json)"
            versions+=("$codex")
            sites+=(plugins/team-harness/.codex-plugin/plugin.json)
          fi
          has_installer=false
          if git cat-file -e "$BASE_SHA:cmd/install/main.go" 2>/dev/null || [ -f cmd/install/main.go ]; then
            has_installer=true
            installer="$(sed -nE 's/.*var version = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' cmd/install/main.go | head -n1)"
            versions+=("$installer")
            sites+=(cmd/install/main.go)
          fi

          for value in "${versions[@]}"; do
            if [ -z "$value" ] || [ "$value" != "$plugin" ]; then
              echo "::error::shared version sites are missing, malformed, or disagree (canonical=$plugin values=${versions[*]})" >&2
              exit 1
            fi
          done

          for site in "${sites[@]}"; do
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$site"; then
              echo "::error::$site was not changed while a distributed runtime input changed" >&2
              exit 1
            fi
          done
          echo "Shared version sites are changed, parseable, and equal at $plugin (Codex=$has_codex installer=$has_installer)."

      # Python and Node are set up UNCONDITIONALLY: the policy-block functional
      # suite validates .claude-plugin/plugin.json, which is IN the release-only
      # allowlist above — so a release-only diff must still exercise it.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # uv (PyYAML frontmatter suite) and Bun (opencode/behavioral suites) back
      # only the heavier suites that stay gated on a release-only diff.
      - name: Set up uv (for the PyYAML frontmatter test)
        if: steps.release-only.outputs.is_release_only != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Bun
        if: steps.release-only.outputs.is_release_only != 'true'
        uses: oven-sh/setup-bun@v2

      # The policy-block suite validates plugin.json — a file that IS in the
      # release-only allowlist — so it runs on every diff, release-only included.
      # The full suite below re-runs it (plus every other suite) only for
      # non-release diffs.
      - name: Run policy-block functional suite (always)
        run: bash tests/test_policy_block.sh

      - name: Run full verification suite
        if: steps.release-only.outputs.is_release_only != 'true'
        env:
          TH_BASELINE_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash tests/run-all.sh

      - name: Release-only diff — heavier suites skipped (policy-block still ran)
        if: steps.release-only.outputs.is_release_only == 'true'
        run: echo "Diff is limited to version sites + CHANGELOG.md + changelog.d/ (a per-PR version bump) — the policy-block suite ran above; skipping the heavier frontmatter (uv/PyYAML) and behavioral suites. This check still ran and reports success; it is not a paths-ignore trigger skip."

  go-test:
    name: go test (installer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test ./cmd/install
        env:
          # ${{ runner.temp }} is /home/runner/work/_temp — user-owned on GitHub-hosted
          # ubuntu runners.  The default /tmp is root-owned (UID 0), which causes the
          # SEC-01 ancestor-ownership walk in datahome_unix.go to refuse t.TempDir()
          # paths because /tmp is not owned by the runner user (UID 1001).
          TMPDIR: ${{ runner.temp }}
        run: go test ./cmd/install/ -count=1

      - name: Cross-compile all release targets (catch platform-specific build breaks)
        # `go test` above runs only on linux/amd64, so a type that differs by GOOS
        # (e.g. syscall.Stat_t.Mode is uint16 on darwin, uint32 on linux) compiles
        # here but breaks the release cross-compile. Build every release.yml target
        # so such breaks surface on the PR, not at tag time.
        run: |
          set -e
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            GOOS=${target%-*}
            GOARCH=${target#*-}
            echo "building $GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -o /dev/null ./cmd/install
          done

  codex-runtime:
    name: Codex generator, marketplace, plugin, hooks, and runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated agent roster
        run: |
          node tools/codex-runtime/generate.mjs --check
          node tools/codex-runtime/test_generate.mjs
          node tools/codex-runtime/sync-skills.mjs --check
      - name: Validate marketplace and plugin structure
        run: |
          node tools/codex-runtime/validate-marketplace.mjs
          python3 tests/test_codex_runtime.py
          python3 tests/test_no_prose_assertions.py
          python3 tests/test_reference_resolution.py
      - name: Verify Codex hooks
        run: |
          node tools/codex-runtime/sync-hooks.mjs --check
          bash tests/test_codex_hooks.sh

  dist-freshness:
    name: hooks/ts dist freshness (rebuild + diff + completeness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install hooks/ts dependencies
        working-directory: hooks/ts
        run: npm install --no-audit --no-fund

      - name: Rebuild TS hook bundles
        working-directory: hooks/ts
        run: npm run build

      - name: Fail on stale committed dist (rebuild must match the committed .cjs)
        run: git diff --exit-code hooks/ts/dist/

      - name: Verify every CC entry has a build script
        # Scoped to *.cc.ts (CC ships bundled dist/*.cjs). *.opencode.ts entries
        # are distributed as raw TypeScript source and are never bundled — see
        # cmd/install/manifest_registry.go's opencode plugin component builder.
        run: |
          missing=0
          for entry in hooks/ts/entry/*.cc.ts; do
            name="$(basename "$entry" .cc.ts)"
            if ! grep -q "\"build:$name\"" hooks/ts/package.json; then
              echo "::error::hooks/ts/package.json is missing a \"build:$name\" script for $entry"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more CC hook entries have no build script — their dist/*.cjs can go stale unnoticed."
            exit 1
          fi
