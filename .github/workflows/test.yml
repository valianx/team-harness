name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pi-native:
    name: native Pi package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Provision the declared Pi compatibility target in an isolated directory
        shell: bash
        run: |
          runtime_root="$RUNNER_TEMP/pi-native-fixture"
          npm install --prefix "$runtime_root" --no-save --no-audit --no-fund @earendil-works/pi-coding-agent@1.3.0
          echo "TH_PI_TEST_ROOT=$runtime_root/node_modules/@earendil-works/pi-coding-agent" >> "$GITHUB_ENV"
      - name: Verify native install, discovery, reload and removal without model requests
        run: node tests/test_pi_native.mjs
      - run: node tests/test_pi_generation.mjs
      - run: node tests/test_pi_settings.mjs
      - run: node tests/test_worker_models.mjs
      - run: node tests/test_pi_worker_models.mjs
      - name: Verify bounded RPC with immediate failure diagnostics
        timeout-minutes: 2
        run: node --test --test-reporter=tap --test-timeout=60000 tests/test_pi_runtime.mjs
      - name: Verify native worker sessions, capabilities and synthetic usage attribution
        run: node tests/test_pi_native_workers.mjs

  presentation-browser:
    name: meeting presentation template (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install maintained browser-test tooling
        run: npm ci --prefix tests/presentation --no-audit --no-fund
      - name: Provision Chromium explicitly
        run: npm exec --prefix tests/presentation -- playwright install --with-deps chromium
      - name: Check browser harness failure semantics
        run: npm --prefix tests/presentation run test:harness
      - name: Prepare the real copied template
        run: |
          mkdir -p "${{ runner.temp }}/meeting-presentations"
          npm --prefix tests/presentation run prepare-fixture -- --workspace "${{ runner.temp }}/meeting-presentations" --candidate "${{ github.sha }}"
      - name: Execute meeting content and interaction checks
        run: npm --prefix tests/presentation test -- --workspace "${{ runner.temp }}/meeting-presentations" --candidate "${{ github.sha }}"
      - name: Retain captures, bounds and execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meeting-presentation-evidence
          path: |
            ${{ runner.temp }}/meeting-presentations/testing/runs/*/*.json
            ${{ runner.temp }}/meeting-presentations/testing/runs/*/*.log
            ${{ runner.temp }}/meeting-presentations/testing/runs/*/captures/
          if-no-files-found: warn

  architecture-diagram:
    name: source-driven architecture diagram (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure copied-project paths on the runner
        run: |
          echo "DIAGRAM_PROJECT=$RUNNER_TEMP/architecture-diagrams/project" >> "$GITHUB_ENV"
          echo "DIAGRAM_EVIDENCE_DIR=$RUNNER_TEMP/architecture-diagrams/evidence" >> "$GITHUB_ENV"
      - name: Copy the maintained starter outside the installation
        run: node -e "require('node:fs').cpSync('skills/reactflow-diagram/references/starter', process.env.DIAGRAM_PROJECT, {recursive:true})"
      - name: Install the copied project's locked dependencies
        run: npm ci --prefix "$DIAGRAM_PROJECT" --no-audit --no-fund
      - name: Provision Chromium explicitly
        run: npm exec --prefix "$DIAGRAM_PROJECT" -- playwright install --with-deps chromium
      - name: Check model, geometry and bounded measurement behavior
        run: npm --prefix "$DIAGRAM_PROJECT" test
      - name: Build independent local assets
        run: npm --prefix "$DIAGRAM_PROJECT" run build
      - name: Check measured browser geometry and interactions
        run: npm --prefix "$DIAGRAM_PROJECT" run test:browser -- tests/browser/geometry.spec.ts tests/browser/viewer.spec.ts
      - name: Check the copied production build on a static server
        env:
          DIAGRAM_SERVER_COMMAND: npm run preview -- --host 127.0.0.1 --port 4178
          DIAGRAM_EVIDENCE_DIR: ${{ runner.temp }}/architecture-diagrams/production-evidence
        run: npm --prefix "$DIAGRAM_PROJECT" run test:browser -- tests/browser/production.spec.ts
      - name: Replace the editable model with a minimal generated input
        run: cp "$DIAGRAM_PROJECT/fixtures/minimal.json" "$DIAGRAM_PROJECT/fixtures/sample.json"
      - name: Verify and rebuild the edited consumer project
        run: |
          npm --prefix "$DIAGRAM_PROJECT" test
          npm --prefix "$DIAGRAM_PROJECT" run build
      - name: Check the edited input independently of demonstration fixtures
        env:
          DIAGRAM_SERVER_COMMAND: npm run preview -- --host 127.0.0.1 --port 4178
          DIAGRAM_EVIDENCE_DIR: ${{ runner.temp }}/architecture-diagrams/minimal-evidence
        run: npm --prefix "$DIAGRAM_PROJECT" run test:browser -- tests/browser/production.spec.ts
      - name: Retain geometry, captures and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-diagram-evidence
          path: |
            ${{ runner.temp }}/architecture-diagrams/evidence/
            ${{ runner.temp }}/architecture-diagrams/production-evidence/
            ${{ runner.temp }}/architecture-diagrams/minimal-evidence/
          if-no-files-found: warn

  reusable-web-presentation:
    name: reusable Slidev kit (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure copied-project and evidence paths
        run: |
          echo "WEB_PRESENTATION_PROJECT=$RUNNER_TEMP/web-presentations/feature" >> "$GITHUB_ENV"
          echo "WEB_PRESENTATION_EVIDENCE_DIR=$RUNNER_TEMP/web-presentations/dev-evidence" >> "$GITHUB_ENV"
      - name: Verify archive identity and scaffold outside the installation
        run: |
          node skills/web-presentation/references/scripts/pack-kit.mjs --check
          node --test skills/web-presentation/references/scripts/packaging.test.mjs
          node skills/web-presentation/references/scripts/create-deck.mjs --template feature --out "$WEB_PRESENTATION_PROJECT"
      - name: Install the copied project's locked dependencies
        run: npm ci --prefix "$WEB_PRESENTATION_PROJECT" --no-audit --no-fund
      - name: Provision Chromium explicitly
        run: npm exec --prefix "$WEB_PRESENTATION_PROJECT" -- playwright install --with-deps chromium
      - name: Check source identity, updates, geometry and delivery tools
        run: |
          npm --prefix "$WEB_PRESENTATION_PROJECT" run kit:identity
          npm --prefix "$WEB_PRESENTATION_PROJECT" run check
          npm --prefix "$WEB_PRESENTATION_PROJECT" test
      - name: Check development geometry, reveals and interaction
        run: npm --prefix "$WEB_PRESENTATION_PROJECT" run test:browser
      - name: Build the independent static artifact under a subpath
        run: npm --prefix "$WEB_PRESENTATION_PROJECT" run build -- --base /talks/example/
      - name: Check the actual static output
        env:
          WEB_PRESENTATION_STATIC: '1'
          WEB_PRESENTATION_BASE_URL: http://127.0.0.1:4173/talks/example/
          WEB_PRESENTATION_SERVER_COMMAND: npm run preview -- --base /talks/example/ --port 4173 --host 127.0.0.1
          WEB_PRESENTATION_EVIDENCE_DIR: ${{ runner.temp }}/web-presentations/static-evidence
        run: npm --prefix "$WEB_PRESENTATION_PROJECT" run test:browser -- tests/browser/production.spec.mjs
      - name: Reuse the kit for an independent architecture deck
        run: |
          node skills/web-presentation/references/scripts/create-deck.mjs --template architecture --out "$RUNNER_TEMP/web-presentations/architecture"
          npm ci --prefix "$RUNNER_TEMP/web-presentations/architecture" --no-audit --no-fund
          npm --prefix "$RUNNER_TEMP/web-presentations/architecture" run check
          npm --prefix "$RUNNER_TEMP/web-presentations/architecture" run build -- --base /talks/architecture/
      - name: Retain browser and static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reusable-web-presentation-evidence
          path: |
            ${{ runner.temp }}/web-presentations/dev-evidence/
            ${{ runner.temp }}/web-presentations/static-evidence/
          if-no-files-found: warn

  windows-hooks:
    name: native Windows hooks and filesystem
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify installer paths on native Windows
        run: go test ./cmd/install/ -v -count=1 -timeout=120s
      - name: Verify native hook registration and Windows filesystem
        run: node tests/test_hook_registration.mjs
      - run: node tests/test_openspec_launcher.mjs
      - run: node tests/test_sync_skills_platform.mjs
      - run: node tests/test_hook_outputs.mjs
      - run: node tests/test_workspace_context.mjs
      - run: node tests/test_space_context.mjs
      - run: node tests/test_resume_session_workspace.mjs
      - run: node tests/test_workspace_bound_hooks.mjs
      - run: node tests/test_th_update_windows.mjs
      - run: python tests/test_install_bootstrap_windows.py
      - run: python tests/test_windows_artifact_fs.py
      - run: python tests/test_review_context_windows.py
      - run: python tests/test_codex_update_convergence.py
      - run: python tests/test_workspace_config.py
      - run: python tests/test_codex_binary_resolution.py
      - name: Verify portable workflow regressions on Windows
        run: python tests/test_inline_git_hardening.py
      - run: python tests/test_github_identity_routes.py
      - run: python tests/test_setup_status.py
      - run: python tests/test_pi_shared_routes.py
      - run: node tests/test_codex_usage.mjs
      - run: node tests/test_pipeline_control_plane.mjs
      - run: node tests/test_version_preflight.mjs
      - name: Verify isolated hook fixtures with Windows Node
        shell: bash
        run: |
          bash tests/test_session_start.sh
          bash tests/test_language_user_prompt.sh
          bash tests/test_update_opencode_sh.sh

  verify:
    name: run-all (frontmatter and workflow suites)
    runs-on: ubuntu-latest
    env:
      # Node/npm/bun suites must run for real in CI, not silently SKIP —
      # see tests/run-all.sh for the skip-to-fail conversion this enables.
      TH_REQUIRE_RUNTIMES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Conditional-noop gate — NOT a `paths-ignore`
      # trigger filter. A `paths-ignore` on the job/workflow trigger would
      # leave this required check permanently "pending" for a diff that
      # matches it, blocking merge. Instead the job always runs (satisfying
      # the required-check contract) and each heavy step below is skipped
      # via `if:` for changelog-only changes. Version sites also contain
      # executable/configuration behavior, so they always run the full suite.
      # Any diff outside that narrow allowlist, or any failure to compute the
      # diff, defaults to running the full suite (fail-closed toward more
      # verification, never less).
      - name: Detect release-only diff
        id: release-only
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          is_release_only=false
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
            if [ -n "$changed" ]; then
              is_release_only=true
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                case "$f" in
                  CHANGELOG.md|changelog.d/*.md)
                    ;;
                  *)
                    is_release_only=false
                    ;;
                esac
              done <<< "$changed"
            fi
          fi
          echo "is_release_only=$is_release_only" >> "$GITHUB_OUTPUT"
          echo "Release-only diff: $is_release_only"

      - name: Set up Node for release preflight
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify release metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/codex-runtime/version-preflight.mjs --base "$BASE_SHA" --head "$HEAD_SHA"

      # Python and Node are set up unconditionally for the workflow and
      # generated-artifact suites.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv (PyYAML frontmatter suite) and Bun (opencode/behavioral suites) back
      # only the heavier suites that stay gated on a release-only diff.
      - name: Set up uv (for the PyYAML frontmatter test)
        if: steps.release-only.outputs.is_release_only != 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Bun
        if: steps.release-only.outputs.is_release_only != 'true'
        uses: oven-sh/setup-bun@v2

      - name: Install locked hook build tooling
        if: steps.release-only.outputs.is_release_only != 'true'
        run: npm ci --prefix hooks/ts --no-audit --no-fund

      - name: Run full verification suite
        if: steps.release-only.outputs.is_release_only != 'true'
        env:
          TH_BASELINE_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bash tests/run-all.sh

      - name: Release-only diff — heavier suites skipped
        if: steps.release-only.outputs.is_release_only == 'true'
        run: echo "Diff is limited to CHANGELOG.md + changelog.d/ — skipping the heavier suites. Version/configuration changes always run them."

  go-test:
    name: go test (installer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: go test ./cmd/install
        env:
          # ${{ runner.temp }} is /home/runner/work/_temp — user-owned on GitHub-hosted
          # ubuntu runners.  The default /tmp is root-owned (UID 0), which causes the
          # SEC-01 ancestor-ownership walk in datahome_unix.go to refuse t.TempDir()
          # paths because /tmp is not owned by the runner user (UID 1001).
          TMPDIR: ${{ runner.temp }}
        run: go test ./cmd/install/ -count=1

      - name: Cross-compile all release targets (catch platform-specific build breaks)
        # `go test` above runs only on linux/amd64, so a type that differs by GOOS
        # (e.g. syscall.Stat_t.Mode is uint16 on darwin, uint32 on linux) compiles
        # here but breaks the release cross-compile. Build every release.yml target
        # so such breaks surface on the PR, not at tag time.
        run: |
          set -e
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            GOOS=${target%-*}
            GOARCH=${target#*-}
            echo "building $GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -o /dev/null ./cmd/install
          done

  codex-runtime:
    name: Codex generator, marketplace, plugin, and runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify generated agent roster
        run: |
          node tools/codex-runtime/generate.mjs --check
          node tools/codex-runtime/test_generate.mjs
          node tools/codex-runtime/sync-skills.mjs --check
          node tools/pi-runtime/generate.mjs --check
      - name: Validate marketplace and plugin structure
        run: |
          node tools/codex-runtime/validate-marketplace.mjs
          python3 tests/test_codex_runtime.py
          python3 tests/test_no_prose_assertions.py
          python3 tests/test_reference_resolution.py
  dist-freshness:
    name: hooks/ts dist freshness (rebuild + diff + completeness)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install hooks/ts dependencies
        working-directory: hooks/ts
        run: npm ci --no-audit --no-fund

      - name: Typecheck TS hooks
        working-directory: hooks/ts
        run: npm run typecheck

      - name: Rebuild TS hook bundles
        working-directory: hooks/ts
        run: npm run build

      - name: Fail on stale committed dist (rebuild must match the committed .cjs)
        run: git diff --exit-code hooks/ts/dist/

      - name: Verify every CC entry has a build script
        # Scoped to *.cc.ts (CC ships bundled dist/*.cjs). *.opencode.ts entries
        # are distributed as raw TypeScript source and are never bundled — see
        # cmd/install/manifest_registry.go's opencode plugin component builder.
        run: |
          missing=0
          for entry in hooks/ts/entry/*.cc.ts; do
            name="$(basename "$entry" .cc.ts)"
            if ! grep -q "\"build:$name\"" hooks/ts/package.json; then
              echo "::error::hooks/ts/package.json is missing a \"build:$name\" script for $entry"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more CC hook entries have no build script — their dist/*.cjs can go stale unnoticed."
            exit 1
          fi
