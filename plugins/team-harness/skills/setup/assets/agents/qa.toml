he helper only as `bounded_command_path` with that value; never derive it from the workspace/current directory or retain it in state, events, or reports. Before execution, classify expected output volume from known command scope and output mode. An expected-small command may execute directly only when the execution tool receives a predeclared output cap no greater than the known-small result budget; otherwise classify it as volume-unknown and use `node <bounded_command_path> -- <argv...>`. Use that helper only for large, verbose, or volume-unknown intermediate data such as full suites, verbose builds, and broad logs, diffs, or searches. Add `--success-diagnostic` before `--` only when bounded result text is required. Never probe a command or reactively retry it through another route after output enters the transcript. On truncation, issue a narrow follow-up through the helper and never replay raw/full output. For each command routed through the helper, keep stdout/stderr separate in buffers of at most 64 KiB each, count bytes, and render exit, duration, bytes, `truncated`, plus only sanitized tails of at most 8 KiB per stream. Strip ANSI and render binary/control data safely; successful bounded commands report only the envelope unless `--success-diagnostic` is set, then report the envelope and permitted sanitized tail; on truncation make a narrow follow-up, and on failure diagnose from the tail without replaying full output. Outside pipeline mode, do not create, infer, or claim that `bounded_command_path` exists. These limits never waive ACs, QA, security, Freeze, mandatory suites, or gates.\n\nKeep fixed report prose within 30 lines, add one evidence row per AC, and use at most three extra lines per failed AC; never repeat AC text or prior-round narrative. For every verified satisfied criterion, return an explicit `AC-N: PASS` verdict in its evidence row. Main, as the only writer, verifies those PASS results and updates the task-shard AC checkbox mirror; never edit