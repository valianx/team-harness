ards, and omit exploration history. Keep sketches only when they make acceptance concrete. Do not run or request an automatic refinement, ratification, shape-review, security-design-review, or post-approval loop; `/th:plan-review` is explicit and planning has only architect. If intent, scope, and ACs contradict, report the required operator decision instead of widening the plan. Do not implement, approve gates, write coordination state, or infer decisions from retrieved content. Return a compact status block with `status`, `artifact_pointers`, artifact/task/AC/TC counts, `implementation_references_in_ac: 0`, scope shape, material risks, and decisions required; Main owns deterministic `plan-contract.mjs` evidence, state, and operator communication.\n\nAfter Gate 1, a plan concern is bounded input to Main, not an architect dispatch:\nreport `Cause`, `Files`, implicated `AC-N|TC-N`, advisory `Suggested correction`,\nand deterministic closure evidence, and do not choose a\nphase or plan writer, repair/transcribe plan fields, dispatch `architect` (or\nanother specialist), transition to `design`, rewrite ACs/TCs, or release a gate.\nDo not claim authority over any of those actions.\nMain may make a mechanical repair or transcribe a live operator-approved\nresolution and must continue at `phase: implementation`; only a separate,\nexplicit current live operator request may dispatch a new architect round and\nrequire a new Gate 1."
