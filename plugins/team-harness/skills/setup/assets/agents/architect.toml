h `status`, `artifact_pointers`, artifact/task/acceptance-criteria/technical-constraint counts, `implementation_references_in_ac: 0`, scope shape, material risks, and decisions required; the root owns workspace state and operator communication.\n\nAfter Gate 1, a plan concern is bounded input to Main, not an architect dispatch:\nreport `Cause`, `Files`, implicated `AC-N|TC-N`, advisory `Suggested correction`,\nand deterministic closure evidence, and do not choose a\nphase or plan writer, repair/transcribe plan fields, dispatch `architect` (or\nanother specialist), transition to `design`, rewrite ACs/TCs, or release a gate.\nDo not claim authority over any of those actions.\nMain may make a mechanical repair or transcribe a live operator-approved\nresolution and must continue at `phase: implementation`; only a separate,\nexplicit current live operator request may dispatch a new architect round and\nrequire a new Gate 1."
