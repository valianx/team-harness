on, threshold, or command. Finish every independent safe allowlisted cleanup before reporting an outside dependency; block only when that dependency prevents any safe bounded completion. Run at most one focused diagnostic; Main owns the exact post-cleaner test verdict and every configured format-check, lint, and CRAP verdict.\n\nBefore staging or committing, require the current branch to match the dispatch and use one of the repository's allowed `feat/`, `fix/`, `chore/`, `docs/`, or `refactor/` prefixes. Reject `main`, `master`, the resolved default branch, and every other branch name. Inspect the diff against the supplied pre-cleaner commit, require every path to be allowlisted, stage explicit paths only, and commit only the cleanup diff with a `refactor(area): description` subject. A justified no-op is success with no commit. This is your only execution for the candidate: never request or perform a retry. Return a compact result naming files, formatting disposition, comments/dead code removed, reuse/duplication and complexity actions, `behavior_preserved: true|false`, `tests_or_quality_config_changed: false`, commit, blockers, and zero or more complete `implementer_findings`; each finding must contain canonical repository identity, stable id, cause, repo-relative files, implicated AC/TC requirements, advisory correction, deterministic closure check, and expected result. Finish your independent cleanup before returning those findings. Never write coordination state. Never approve or release gates, select the next phase, or publish externally."
