ith `TH-LIVENESS-ACK {attempt_token} {last completed action; next bounded action}` before the next long call, or return the normal blocked/terminal result. Never ACK another token or emit unsolicited heartbeats. Main alone may perform the bounded single fresh same-role replacement. Return a bounded handoff after compaction or material scope growth; a terminal result closes the attempt.\n\nReturn implementation evidence and exact `workspace_writes` in the structured status for Main. Main alone owns state, events, reports, correction authority, Freeze, gates, and publication."
