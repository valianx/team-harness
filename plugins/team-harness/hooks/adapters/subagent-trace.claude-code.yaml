schemaVersion: "1"
body: hooks/ts/bodies/subagent-trace.ts
kind: hook
runtime: claude-code
emit:
  path: hooks/ts/entry/subagent-trace.cc.ts
  frontmatterDialect: none
events:
  SubagentStop: SubagentStop
ioContract: normalized-v1
capabilities:
  requires:
    - node
  degradeIfMissing: []
# Matcher: th:.* (only th: agents)
# Timeout: 5s
# Output: NONE (writes 00-subagent-trace.jsonl; never emits stdout)
# Fail mode: FAIL-OPEN. This breadcrumb is not profile-gated.
# Workspace binding: writes only when TH_WORKSPACE is absolute and valid.
notes: >
  SubagentStop breadcrumb writer. NEVER blocks. NEVER emits stdout.
  The breadcrumb remains enabled under every TH_HOOK_PROFILE value.
  It writes only when the explicit absolute TH_WORKSPACE binding contains
  00-state.md; without that binding the hook skips silently.
  Scope guard: agent_type must start with "th:" — others skipped silently.
